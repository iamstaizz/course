<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
<h1>Today</h1>

<div class="category" data-category="design">
    <h2>Design</h2>
    <div class="task" draggable="true"><input type="checkbox"><span>Create icons for a dashboard</span></div>
    <div class="task" draggable="true"><input type="checkbox"><span>Plan your meal</span></div>
    <div class="task" draggable="true"><input type="checkbox"><span>Prepare a design presentation</span></div>
</div>

<div class="category" data-category="personal">
    <h2>Personal</h2>
    <div class="task" draggable="true"><input type="checkbox"><span>Review daily goals before sleeping</span></div>
    <div class="task" draggable="true"><input type="checkbox"><span>Stretch for 15 minutes</span></div>
</div>

<div class="category" data-category="house">
    <h2>House</h2>
    <div class="task" draggable="true"><input type="checkbox"><span>Water indoor plants</span></div>
</div>

<div class="add-task">
    <input type="text" id="newTask" placeholder="Write a task...">
    <button id="addBtn">Add</button>
</div>

</body>
</html>
